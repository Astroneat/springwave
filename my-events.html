<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>My Events - SpringWave</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource-variable/google-sans-flex@5.2.5/index.css" />
  <link href="https://fonts.googleapis.com/css2?family=Aleo:ital,wght@0,300;0,400;0,600;0,700;0,800;1,400;1,700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
</head>
<body class="bg-background font-body-md">
  <div id="navbar-container"></div>

  <div class="relative z-10 max-w-5xl mx-auto px-4 pt-24 pb-8">
    <div class="flex items-center gap-3 mb-8">
      <span class="w-10 h-10 rounded-xl bg-[#ecedfa] flex items-center justify-center text-[#1755ba]">
        <span class="material-symbols-outlined">event</span>
      </span>
      <div>
        <h1 class="text-2xl font-bold text-[#191b22]">My Events</h1>
        <p class="text-sm text-[#64748b]">Events you've participated in</p>
      </div>
    </div>

    <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4 mb-6 hidden" id="filter-bar">
      <div class="flex items-center gap-2">
        <span class="px-3 py-1 rounded-full text-xs font-semibold bg-emerald-50 text-emerald-700 border border-emerald-200/50" id="active-count-badge">0 Active</span>
        <span class="px-3 py-1 rounded-full text-xs font-semibold bg-slate-100 text-slate-600 border border-slate-200/50" id="inactive-count-badge">0 Past</span>
      </div>
      <button id="toggle-expired-btn" class="inline-flex items-center gap-2 px-4 py-2 rounded-xl border border-slate-200 bg-white hover:bg-slate-50 active:scale-[0.98] text-sm font-semibold text-slate-700 transition-all shadow-sm cursor-pointer">
        <span class="material-symbols-outlined text-lg" id="toggle-expired-icon">visibility</span>
        <span id="toggle-expired-text">Show Past Events</span>
      </button>
    </div>

    <div id="events-list" class="space-y-4">
      <div class="text-center py-12 text-[#64748b]">Loading...</div>
    </div>
  </div>

  <!-- Rate Modal -->
  <div id="rate-modal" hidden class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/60 backdrop-blur-sm opacity-0 pointer-events-none transition-all duration-300" role="dialog" aria-modal="true" aria-labelledby="rate-modal-title">
    <div class="bg-white rounded-2xl max-w-md w-full p-6 shadow-2xl scale-95 transition-transform duration-300 relative">
      <button id="close-rate-modal" type="button" aria-label="Close" class="absolute top-4 right-4 text-slate-400 hover:text-slate-600 transition-colors cursor-pointer">
        <span class="material-symbols-outlined">close</span>
      </button>
      <div class="text-center mt-2">
        <h4 id="rate-modal-title" class="font-bold text-lg text-slate-900 mb-2">Rate Event</h4>
        <p class="text-sm text-slate-500 mb-4" id="rate-modal-event-name">Event Name</p>
        <div class="flex justify-center gap-2 mb-6" id="star-rating" role="radiogroup" aria-label="Rating">
          <button type="button" class="star cursor-pointer text-3xl text-slate-200 hover:text-yellow-400 transition-colors" data-rating="1" aria-label="1 star" role="radio" aria-checked="false">★</button>
          <button type="button" class="star cursor-pointer text-3xl text-slate-200 hover:text-yellow-400 transition-colors" data-rating="2" aria-label="2 stars" role="radio" aria-checked="false">★</button>
          <button type="button" class="star cursor-pointer text-3xl text-slate-200 hover:text-yellow-400 transition-colors" data-rating="3" aria-label="3 stars" role="radio" aria-checked="false">★</button>
          <button type="button" class="star cursor-pointer text-3xl text-slate-200 hover:text-yellow-400 transition-colors" data-rating="4" aria-label="4 stars" role="radio" aria-checked="false">★</button>
          <button type="button" class="star cursor-pointer text-3xl text-slate-200 hover:text-yellow-400 transition-colors" data-rating="5" aria-label="5 stars" role="radio" aria-checked="false">★</button>
        </div>
        <label for="rate-review-content" class="sr-only">Review (optional)</label>
        <textarea id="rate-review-content" class="w-full px-4 py-3 rounded-xl border border-slate-200 text-sm resize-none mb-4 outline-none focus:border-primary" rows="3" placeholder="Write your review (optional)..."></textarea>
        <button id="submit-rate-btn" class="w-full py-3 px-4 rounded-xl bg-[#1755ba] hover:bg-[#1755ba]/90 text-white font-semibold text-sm shadow-md transition-all cursor-pointer disabled:opacity-50 disabled:cursor-not-allowed">
          Submit Review
        </button>
      </div>
    </div>
  </div>

  <!-- Certificate Modal -->
  <div id="cert-modal" hidden class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/60 backdrop-blur-sm opacity-0 pointer-events-none transition-all duration-300" role="dialog" aria-modal="true" aria-label="Certificate">
    <div class="bg-white rounded-2xl max-w-sm w-full p-6 shadow-2xl scale-95 transition-transform duration-300 relative">
      <button id="close-cert-modal" type="button" aria-label="Close" class="absolute top-4 right-4 text-slate-400 hover:text-slate-600 transition-colors cursor-pointer">
        <span class="material-symbols-outlined">close</span>
      </button>
      <div class="text-center mt-2">
        <div class="w-16 h-16 rounded-full bg-amber-100 flex items-center justify-center mx-auto mb-4">
          <span class="material-symbols-outlined text-3xl text-amber-600">workspace_premium</span>
        </div>
        <h4 class="font-bold text-lg text-slate-900 mb-1">Certificate</h4>
        <p class="text-sm text-slate-500 mb-1" id="cert-modal-event-name">Event Name</p>
        <p class="text-xs text-slate-400 font-mono mb-4" id="cert-modal-code">CODE</p>
        <a id="cert-verify-link" href="" target="_blank" class="inline-flex items-center gap-2 py-3 px-6 rounded-xl bg-[#1755ba] hover:bg-[#1755ba]/90 text-white font-semibold text-sm shadow-md transition-all">
          <span class="material-symbols-outlined text-[18px]">verified</span> View Certificate
        </a>
      </div>
    </div>
  </div>

  <script type="module" src="js/pages/my-events.js"></script>
</body>
</html>
