<!doctype html>
<html lang="en" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title data-i18n="email_verify.title">SpringWave - Verify Email</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
    />
    <link rel="stylesheet" href="./src/style.css" />
  </head>
  <body
    class="min-h-screen overflow-y-auto bg-cover flex justify-center items-center p-10 max-sm:p-5"
    style="
      background-image:
        linear-gradient(rgba(255, 255, 255, 0.3), rgba(255, 255, 255, 0.3)),
        url(&quot;assets/images/banner-landscape-pixelart.png&quot;);
      backdrop-filter: blur(3px);
    "
  >
    <div
      class="w-[70%] max-w-[600px] bg-white/90 backdrop-blur-sm rounded-2xl shadow-[0_10px_30px_rgba(0,0,0,0.12)] p-9 max-sm:w-full max-sm:p-6 max-sm:rounded-2xl text-center"
    >
      <a
        href="index.html"
        class="inline-block mb-6 transition duration-200 hover:-translate-y-1"
      >
        <div
          class="inline-flex items-center gap-2 px-3 py-1 bg-[#23499b] text-white font-semibold rounded-xl shadow-md transition-all duration-200 hover:bg-[#183a82] hover:-translate-y-1"
        >
          <i class="bi bi-house-door text-[24px]"></i> <span data-i18n="email_verify.home_btn">Home</span>
        </div>
      </a>

      <h1
        class="text-[42px] max-sm:text-[30px] font-bold text-[#23499b] text-center mb-10 max-sm:mb-6"
        data-i18n="email_verify.title"
      >
        VERIFY EMAIL
      </h1>

      <div id="verification-status" class="flex flex-col items-center gap-6">
        <div id="loading-spinner" class="flex flex-col items-center gap-4">
          <span
            class="material-symbols-outlined animate-spin text-7xl text-[#23499b]"
            >progress_activity</span
          >
          <p class="text-gray-600 text-lg" data-i18n="email_verify.verifying">Verifying your email...</p>
        </div>

        <div
          id="success-message"
          style="display: none"
          class="flex flex-col items-center gap-4"
        >
          <div
            class="w-24 h-24 rounded-full bg-green-100 flex items-center justify-center animate-bounce-in"
          >
            <span class="material-symbols-outlined text-6xl text-green-500"
              >check_circle</span
            >
          </div>
          <h2 class="text-3xl font-bold text-[#23499b] mt-2" data-i18n="email_verify.success_title">
            Email Verified!
          </h2>
          <p class="text-gray-600 text-lg max-w-md" data-i18n="email_verify.success_desc">
            Your email has been successfully verified. You can now post
            discussions and explore the community.
          </p>
        </div>

        <div
          id="error-message"
          style="display: none"
          class="flex flex-col items-center gap-4"
        >
          <div
            class="w-24 h-24 rounded-full bg-red-100 flex items-center justify-center"
          >
            <span class="material-symbols-outlined text-6xl text-red-500"
              >error</span
            >
          </div>
          <h2 class="text-3xl font-bold text-red-500 mt-2" data-i18n="email_verify.failed_title">
            Verification Failed
          </h2>
          <p id="error-text" class="text-gray-600 text-lg" data-i18n="email_verify.invalid_token">
            This link is invalid or expired.
          </p>
        </div>
      </div>

      <a
        href="login.html"
        id="login-btn"
        style="display: none"
        class="block w-full p-4 bg-[#ffde42] border-2 border-[#23499b] rounded-2xl text-xl font-bold cursor-pointer mt-6 transition duration-200 hover:-translate-y-0.5 hover:shadow-[0_8px_18px_rgba(255,222,66,0.4)] max-sm:p-3.5 max-sm:text-lg"
      >
        <i class="bi bi-box-arrow-in-right mr-2"></i> <span data-i18n="email_verify.login_btn">Go to Login</span>
      </a>

      <a
        href="index.html"
        id="home-btn"
        style="display: none"
        class="inline-block mt-5 text-[#23499b] font-semibold text-lg transition duration-200 hover:text-[#183a82]"
      >
        <i class="bi bi-arrow-left mr-1"></i> <span data-i18n="email_verify.home_btn">Back to Home</span>
      </a>
    </div>

    <script type="module">
      import "./src/style.css";
      import { API_BASE_URL } from "./js/config.js";
      import { initI18n, applyTranslation, t } from "./js/lib/i18n.js";

      window.addEventListener("language-changed", () => {
        applyTranslation();
      });

      async function verifyEmail() {
        await initI18n();

        const params = new URLSearchParams(window.location.search);
        const token = params.get("token");

        const spinner = document.getElementById("loading-spinner");
        const successMsg = document.getElementById("success-message");
        const errorMsg = document.getElementById("error-message");
        const errorText = document.getElementById("error-text");
        const loginBtn = document.getElementById("login-btn");
        const homeBtn = document.getElementById("home-btn");

        if (!token) {
          spinner.style.display = "none";
          errorMsg.style.display = "flex";
          errorText.textContent = t("email_verify.invalid_token", "This link is invalid or expired.");
          homeBtn.style.display = "inline-block";
          return;
        }

        try {
          const response = await fetch(
            `${API_BASE_URL}/auth/verify-email/${token}`,
          );
          const data = await response.json();

          spinner.style.display = "none";

          if (response.ok) {
            successMsg.style.display = "flex";
            loginBtn.style.display = "block";
            homeBtn.style.display = "inline-block";
          } else {
            errorMsg.style.display = "flex";
            errorText.textContent = data.error || t("email_verify.invalid_token", "This link is invalid or expired.");
            homeBtn.style.display = "inline-block";
          }
        } catch {
          spinner.style.display = "none";
          errorMsg.style.display = "flex";
          errorText.textContent = t("email_verify.network_error", "Network error. Please try again.");
          homeBtn.style.display = "inline-block";
        }
      }

      verifyEmail();
    </script>
  </body>
</html>
