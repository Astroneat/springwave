<!-- CARD 1 -->
<div class="card card-contain relative group">
    <img src="https://images.unsplash.com/photo-1529156069898-49953e39b3ac?q=80&w=1200&auto=format&fit=crop" class="card-image" loading="lazy" decoding="async" alt="Activity cover">
    
    <!-- Tag Overlay -->
    <div class="card-tag-overlay">
        <i class="fa-solid fa-tag" aria-hidden="true"></i>
        <span class="info-type truncate">Social Activity</span>
    </div>

    <div class="card-content">
        <h2 class="card-title">Clean Mỹ Khê Beach</h2>

        <div class="info">
            <i class="fa-solid fa-location-dot"></i>
            <span class="info-location">Mỹ Khê Beach</span>
        </div>

        <div class="info">
            <i class="fa-regular fa-calendar"></i>
            <span class="info-date">15/05/2026</span>
        </div>

        <div class="info">
            <i class="fa-solid fa-user-tie"></i>
            <span class="info-host">Host Name</span>
        </div>

        <div class="card-bottom">
            <button class="details-btn" id="details-btn">View Details</button>

            <div class="star">
                <i class="fa-solid fa-star"></i>
            </div>
        </div>

    </div>
</div>
