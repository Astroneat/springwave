<!-- CARD 1 -->
<div class="card card-contain relative group">
    <img src="https://images.unsplash.com/photo-1529156069898-49953e39b3ac?q=80&w=1200&auto=format&fit=crop" class="card-image" loading="lazy" decoding="async" alt="Activity Image">
    
    <!-- Tag Overlay -->
    <div class="card-tag-overlay absolute top-2 right-2 sm:top-2.5 sm:right-2.5 bg-blue-50/95 backdrop-blur-sm px-2 py-0.5 sm:px-2.5 sm:py-1 rounded-md sm:rounded-lg text-[9.5px] sm:text-xs font-bold text-primary flex items-center gap-1 sm:gap-1.5 border border-blue-200/70 z-10 shadow-sm max-w-[75%]">
        <i class="fa-solid fa-tag text-primary text-[8px] sm:text-[10px] shrink-0"></i>
        <span class="info-type truncate">Social Activity</span>
    </div>

    <div class="card-content">
        <h2 class="card-title">Clean Mỹ Khê Beach</h2>

        <div class="info">
            <i class="fa-solid fa-location-dot"></i>
            <span class="info-location">Mỹ Khê Beach</span>
        </div>

        <div class="info">
            <i class="fa-regular fa-calendar"></i>
            <span class="info-date">15/05/2026</span>
        </div>

        <div class="info">
            <i class="fa-solid fa-user-tie"></i>
            <span class="info-host">Host Name</span>
        </div>

        <div class="card-bottom">
            <button class="details-btn">View Details</button>

            <button type="button" class="star" aria-label="Favorite" tabindex="0">
                <i class="fa-solid fa-star"></i>
            </button>
        </div>

    </div>
</div>
